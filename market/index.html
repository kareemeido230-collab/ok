<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>market | KO</title>
</head>
<body>
    
    <div class="container">
        <div class="head">
            <h2><span>m</span>et<span>oo</span> market</h2>
            <p>مشروع لإدارة نظام الشكك في المحلات</p>
        </div>
        <div class="inputs">
            <input type="text" placeholder="الاسم" id="title">
            <input type="text" placeholder="ملاحظة" id="note">
            <input type="number" placeholder="السعر" id="price">
            <button id="submit">إضافة</button>
        </div>
        <div class="outputs">
            <input onkeyup="searchData(this.value)" type="text" placeholder="البحث" id="search">
        </div>
        <table>
            <tr>
                <th>id</th>
                <th>الاسم</th>
                <th>السعر</th>
                <th>ملاحظة</th>
                <th>تعديل</th>
                <th>حذف</th>
            </tr>
            <tbody id="tbody">
            </tbody>
        </table>
    </div>

    <script src="main.js"></script>
</body>
</html>
